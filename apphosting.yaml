# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  cpu: 1
  memoryMiB: 1024
  timeoutSeconds: 3600
  # Environment variables and secrets.
env:
  # Google Analytics (GA4) measurement ID — public value, inlined at build time.
  # NEXT_PUBLIC_* must be available at BUILD so Next.js can embed it.
  - variable: NEXT_PUBLIC_GA_ID
    value: G-HE8GRTQ1DT
    availability:
      - BUILD
      - RUNTIME
  # Google Drive API Configuration
  # Using Cloud Secret Manager for secure storage
  - variable: GOOGLE_SERVICE_ACCOUNT_KEY
    secret: GOOGLE_SERVICE_ACCOUNT_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: GOOGLE_DRIVE_FOLDER_ID
    secret: GOOGLE_DRIVE_FOLDER_ID
  - variable: SERVER_URL
    secret: SERVER_URL
  - variable: GOOGLE_DRIVE_FOLDER_ID2
    secret: GOOGLE_DRIVE_FOLDER_ID2
  # MinorWire Stripe fulfillment (live + optional test)
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_SECRET_KEY_TEST
    secret: STRIPE_SECRET_KEY_TEST
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET_TEST
    secret: STRIPE_WEBHOOK_SECRET_TEST
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_MINORWIRE_STRIPE_MODE
    value: live
    availability:
      - BUILD
      - RUNTIME
  - variable: MINORWIRE_STRIPE_MODE
    value: live
    availability:
      - RUNTIME
  - variable: MINORWIRE_DOWNLOAD_SECRET
    secret: MINORWIRE_DOWNLOAD_SECRET
    availability:
      - RUNTIME
  - variable: MINORWIRE_FULFILLMENT_SECRET
    secret: MINORWIRE_FULFILLMENT_SECRET
    availability:
      - RUNTIME
  - variable: MINORWIRE_PUBLIC_BASE_URL
    value: https://jittee.com
    availability:
      - RUNTIME
  - variable: MINORWIRE_MAIL_ENDPOINT
    value: https://yyeleqhfbbjnscaddutx.supabase.co/functions/v1/minorwire-fulfillment
    availability:
      - RUNTIME
